# BPA stack for one server. Run from the deploy folder: docker compose --env-file .env up -d --build
# Caddy (in the server-infra repository) reaches the API on the shared "edge" network.
name: bpa

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bpa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - bpa-db:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bpa"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Shared migration runner from server-infra (clone it next to this repo's parent folder, as ~/server-infra).
  # Applies each migration once, in name order, and records it in schema_migrations. Exits when done.
  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: bpa
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../db/migrations:/migrations:ro
      - ${INFRA_DIR:-../../server-infra}/migrate:/infra:ro
    command: ["sh", "/infra/migrate.sh"]
    restart: "no"
    networks: [internal]

  # Creates or updates the login role the API uses. Runs after the migrations, then exits.
  login-role:
    image: postgres:16
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGDATABASE: bpa
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BPA_APP_LOGIN_PASSWORD: ${BPA_APP_LOGIN_PASSWORD:?set BPA_APP_LOGIN_PASSWORD in .env}
    volumes:
      - ./create_login_role.sql:/create_login_role.sql:ro
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -v pw=\"$$BPA_APP_LOGIN_PASSWORD\" -q -f /create_login_role.sql"]
    restart: "no"
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bpa-api
    depends_on:
      login-role:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      ConnectionStrings__BpaApp: Host=db;Port=5432;Database=bpa;Username=bpa_login;Password=${BPA_APP_LOGIN_PASSWORD}
      # Caddy's fixed address on the edge network. Only requests from here may set the client address.
      TrustedProxies__0: ${CADDY_ADDRESS:?set CADDY_ADDRESS in .env}
      # Email is sent only when SMTP_HOST and SMTP_FROM are set. Leave them empty to share links by hand.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
    volumes:
      - bpa-keys:/keys
    networks:
      internal: {}
      edge:
        aliases: [bpa-api]

volumes:
  bpa-db:
  bpa-keys:

networks:
  internal:
  edge:
    external: true
