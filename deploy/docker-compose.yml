# BPA stack for one server. Run from the deploy folder: docker compose --env-file .env up -d --build
# Passwords are read from files in deploy/secrets (see docs/deployment.md), not from .env.
# Caddy (in the server-infra repository) reaches the API on the shared "edge" network.
name: bpa

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bpa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - bpa-db:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bpa"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Shared migration runner from server-infra (clone it next to this repo's parent folder, as ~/server-infra).
  # Applies each migration once, in name order, and records it in schema_migrations. Exits when done.
  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: bpa
      PGUSER: postgres
    secrets:
      - db_password
    volumes:
      - ../db/migrations:/migrations:ro
      - ${INFRA_DIR:-../../server-infra}/migrate:/infra:ro
    command: ["sh", "-c", "export PGPASSWORD=$$(cat /run/secrets/db_password) && sh /infra/migrate.sh"]
    restart: "no"
    networks: [internal]

  # Creates or updates the login role the API uses. Runs after the migrations, then exits.
  login-role:
    image: postgres:16
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGDATABASE: bpa
      PGUSER: postgres
    secrets:
      - db_password
      - db_login_password
    volumes:
      - ./create_login_role.sql:/create_login_role.sql:ro
    command: ["sh", "-c", "export PGPASSWORD=$$(cat /run/secrets/db_password) && psql -v ON_ERROR_STOP=1 -v pw=\"$$(cat /run/secrets/db_login_password)\" -q -f /create_login_role.sql"]
    restart: "no"
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bpa-api
    depends_on:
      login-role:
        condition: service_completed_successfully
    restart: unless-stopped
    # Builds the connection string at start-up, so the login password is read from its secret file.
    # Builds secret settings at start-up from their secret files, then starts the API.
    entrypoint: ["sh", "-c", "export ConnectionStrings__BpaApp=\"Host=db;Port=5432;Database=bpa;Username=bpa_login;Password=$$(cat /run/secrets/db_login_password)\" && export Smtp__Password=\"$$(cat /run/secrets/smtp_password)\" && exec dotnet Bpa.Api.dll"]
    secrets:
      - db_login_password
      - smtp_password
    environment:
      # Caddy's fixed address on the edge network. Only requests from here may set the client address.
      TrustedProxies__0: ${CADDY_ADDRESS:?set CADDY_ADDRESS in .env}
      # Email is sent only when SMTP_HOST and SMTP_FROM are set. Leave them empty to share links by hand.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__From: ${SMTP_FROM:-}
    volumes:
      - bpa-keys:/keys
    networks:
      internal: {}
      edge:
        aliases: [bpa-api]

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_login_password:
    file: ./secrets/db_login_password.txt
  smtp_password:
    file: ./secrets/smtp_password.txt

volumes:
  bpa-db:
  bpa-keys:

networks:
  internal:
  edge:
    external: true
